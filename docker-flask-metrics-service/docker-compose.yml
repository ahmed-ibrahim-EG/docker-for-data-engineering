services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: telemetry_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  metrics_api:
    build: .
    container_name: telemetry_flask
    ports:
      - "5000:5000"
    env_file:
      - .env
    depends_on:
      sqlserver:
        condition: service_healthy

volumes:
  mssql_data: